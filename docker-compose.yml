services:
  mysql:
    image: mysql:8.4
    container_name: fitlog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: fitlog_root
      MYSQL_DATABASE: fitlog
    ports:
      - "3307:3306"
    volumes:
      - fitlog_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  fitlog_data:
